services:

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    ports:
      - "9001:9001"
    env_file:
      - .env
    volumes:
      - minio-storage:/data
      - minio-config:/root/.minio
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 3

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./minio/init-minio.sh:/init-minio.sh:ro
    entrypoint: ["/bin/sh", "/init-minio.sh"]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: backend
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    env_file:
      - .env
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/healthcheck" ]
      interval: 5s
      timeout: 5s
      retries: 3

  llm-parser:
    build:
      context: .
      dockerfile: llm-parser/Dockerfile
    container_name: llm-parser
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/parser/healthcheck" ]
      interval: 5s
      timeout: 5s
      retries: 3
    env_file:
      - .env

  rec-trimmer:
    build:
      context: .
      dockerfile: rec-trimmer/Dockerfile
    container_name: rec-trimmer
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    env_file:
      - .env
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/trimmer/healthcheck/" ]
      interval: 5s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
      backend:
        condition: service_healthy
      llm-parser:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - nginx_data:/data


volumes:
  nginx_data:
  minio-storage:
  minio-config:
