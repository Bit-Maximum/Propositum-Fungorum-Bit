<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Клинический опросник</title>

    <link rel="stylesheet" href="/static/assets/css/style.css?v=20260207">
    <link rel="stylesheet" href="/static/assets/css/index.css?v=20260207">


    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
</head>
<body>
    <header class="header">
        <div class="container header__inner">
            <a class="brand" href="/">
                <span class="brand__logo" aria-hidden="true">
                    <i class="fas fa-bone custom-logo"></i>
                </span>
                <span class="brand__title">Клинический опросник</span>

            </a>

            <nav class="nav" aria-label="Основная навигация">
                <a class="nav__link" href="/"><i class="fas fa-home"></i> Главная</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="container">

            <!-- Приветственный блок -->
            <section class="hero">
                <div class="hero__content">
                    <h1 class="hero__title">Опросник по медицинской рекомендации</h1>
                </div>

                <div class="hero__panel" aria-hidden="true">
                    <img src="/static/assets/img/img.png" alt="" class="hero__image" />
                </div>
            </section>

            <!-- Выбор клинической рекомендации -->
            <section class="card">
                <div class="card__header">
                    <h2 class="card__title">Клинические рекомендации</h2>
                </div>

                <div class="card__body grid" id="loadQuestionaries">
                </div>
            </section>

        </div>
    </main>

    <footer class="footer">
        <div class="container footer__inner">
            <small class="footer__text">
                <p>Разработано на основе Федеральных клинических рекомендаций</p>
                <p class="version">Версия 1.0.0 | Доказательная медицина</p>
            </small>
        </div>
    </footer>

    <script src="/static/assets/js/index.js"></script>
</body>
</html>
