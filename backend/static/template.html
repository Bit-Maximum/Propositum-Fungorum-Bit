<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Клинический опросник</title>

    <link rel="stylesheet" href="/static/assets/css/style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
</head>
<body>
    <header class="header">
        <div class="container header__inner">
            <a class="brand" href="/">
                <span class="brand__logo" aria-hidden="true">
                    <i class="fas fa-bone custom-logo"></i>
                </span>
                <span class="brand__title">Клинический опросник</span>
            </a>

            <nav class="nav" aria-label="Основная навигация">
                <a class="nav__link" href="/"><i class="fas fa-home"></i> Главная</a>
            </nav>
        </div>
    </header>

    <footer class="footer">
        <div class="container footer__inner">
            <small class="footer__text">
                <p>Разработано на основе Федеральных клинических рекомендаций "{{display_name}}"</p>
                <p class="version">Версия 1.0.0 | Доказательная медицина</p>
            </small>

            <!--<div class="footer__links">-->
            <!--    <a href="#" class="footer__link">Политика</a>-->
            <!--    <a href="#" class="footer__link">Контакты</a>-->
            <!--</div>-->
        </div>
    </footer>



  <main class="main" id="home">
    <div class="container">

      <!-- Hero / приветственный блок -->
      <section class="hero">
        <div class="hero__content">
          <h1 class="hero__title">Опросник по медицинской рекомендации</h1>
          <p class="hero__subtitle">
            <!-- Пустое место под описание -->
          </p>

          <div class="hero__actions">
            <button class="btn btn--primary" type="button" data-action="start">
              Начать
            </button>
            <button class="btn btn--ghost" type="button" data-action="about">
              Подробнее
            </button>
          </div>
        </div>

        <div class="hero__panel" aria-hidden="true">
          <!-- Пустое место под иллюстрацию/иконку -->
        </div>
      </section>

      <!-- Оболочка опросника -->
      <section class="card" id="survey" aria-label="Опрос">
        <div class="card__header">
          <h2 class="card__title">Опрос</h2>
          <div class="card__meta">
            <!-- место под прогресс -->
          </div>
        </div>

        <div class="card__body">
          <!-- место под вопросы -->
          <div class="placeholder">
            <div class="placeholder__line"></div>
            <div class="placeholder__line"></div>
            <div class="placeholder__line placeholder__line--short"></div>
          </div>
        </div>

        <div class="card__footer">
          <button class="btn" type="button" data-action="prev" disabled>Назад</button>
          <button class="btn btn--primary" type="button" data-action="next">Далее</button>
        </div>
      </section>

      <!-- Результат -->
      <section class="card" id="result" aria-label="Результат">
        <div class="card__header">
          <h2 class="card__title">Результат</h2>
        </div>

        <div class="card__body">
          <!-- место под результат -->
          <div class="placeholder">
            <div class="placeholder__line"></div>
            <div class="placeholder__line placeholder__line--short"></div>
          </div>
        </div>

        <div class="card__footer">
          <button class="btn btn--ghost" type="button" data-action="restart">
            Пройти заново
          </button>
          <button class="btn" type="button" data-action="export">
            Экспорт
          </button>
        </div>
      </section>

    </div>
  </main>


  <script src="assets/js/app.js"></script>
</body>
</html>
